name: Publish/Upload dotnet package on release

# PLEASE NOTE: PUBLISHING/DEPLOYMENT
# Release is to be created manually at GitHub releases management page
# - release name usually contains "v1.2.3"
# After creating a GitHub release, following actions will automatically run:
# 1. NuGet package (version as defined in VS.Net project property "package version")
# 2. Attaching of compiled binaries to GitHub release

on:
    release:
        types: [created]

    workflow_dispatch:
        inputs:
            release_tag:
                description: Published GitHub release tag to retry
                required: true
                type: string

env:
    # Path to the solution file relative to the root of the project.
    SOLUTION_FILE_PATH: .

    # Name of project configuration for build as well as name of the bin output subdirectory (both must match for "dotnet pack" to find compiled files!)
    BUILD_CONFIGURATION: Release
    # Name of build project which creates required output for packaging/deployment
    BUILD_PROJECT: CompuMaster.ComInterop/CompuMaster.ComInterop.vbproj
    # Name of directory (e.g. "bin") containing the subdirectory (e.g. "CI_CD") with all output files (*.dll)
    BUILD_OUTPUT_BASEDIR: CompuMaster.ComInterop/bin

jobs:
    publish:
        if: github.event_name == 'release' || github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        #if: false # always skip job

        env:
          VersionPrefix: ${{ inputs.release_tag || github.ref_name }}

        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
                  fetch-depth: 0

            - name: Verify the published release
              if: github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  test "$(gh release view --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft -- "$RELEASE_TAG")" = false
                  git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"

            - name: Setup .NET Core
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Install dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --configuration=${{env.BUILD_CONFIGURATION}} --no-restore

            - name: Pack binaries
              run: |
                  (cd ${{env.BUILD_OUTPUT_BASEDIR}}/${{env.BUILD_CONFIGURATION}} && zip $OLDPWD/bin.zip -r .)

            - name: Publish binaries
              if: github.event_name == 'release'
              uses: softprops/action-gh-release@v1
              with:
                  files: "bin.zip"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Pack
              run: |
                  dotnet pack --no-build --configuration "$BUILD_CONFIGURATION" "$BUILD_PROJECT" --output packages
                  dotnet pack --no-build --configuration "$BUILD_CONFIGURATION" CompuMaster.MsWordComInterop/CompuMaster.MsWordComInterop.vbproj --output packages
                  dotnet pack --no-build --configuration "$BUILD_CONFIGURATION" CompuMaster.MsPowerPointComInterop/CompuMaster.MsPowerPointComInterop.vbproj --output packages

            - name: Publish package artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: NuGet packages
                  path: packages/*

            - name: Sign in to NuGet with Trusted Publishing
              id: nuget-login
              uses: NuGet/login@v1
              with:
                  user: ${{ vars.NUGET_USER || secrets.NUGET_USER || 'compumaster' }}

            - name: Push existing package IDs to NuGet
              env:
                  NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
              run: |
                  for package in packages/*.nupkg; do
                      name=$(basename "$package")
                      id=$(printf '%s' "$name" | sed -E 's/\.[0-9]+(\.[0-9]+){1,3}(-[^.]*)?\.nupkg$//' | tr '[:upper:]' '[:lower:]')
                      status=$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "https://api.nuget.org/v3-flatcontainer/$id/index.json")
                      case "$status" in
                          200)
                              dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
                              ;;
                          404)
                              echo "::notice::First publication of $id must be performed from the authorized workstation."
                              ;;
                          *)
                              echo "::error::NuGet package lookup returned HTTP $status for $id."
                              exit 1
                              ;;
                      esac
                  done
